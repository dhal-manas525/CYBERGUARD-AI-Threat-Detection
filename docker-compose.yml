version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=CYBERGUARD
      - DATABASE_URL=sqlite:///./cyberguard.db
      - SECRET_KEY=cyberguard_super_secure_jwt_secret_key_change_in_production
      - ENVIRONMENT=production
      - DEMO_MODE=true
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
